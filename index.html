<html lang="en">
<head>

<title>NEON PITCH — Physics Lab</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061523;touch-action:none}
#app,.arena-wrap{position:fixed;inset:0;width:100%;height:100%;margin:0;padding:0;overflow:hidden}
canvas{display:block;width:100%;height:100%;max-width:none;border:0;border-radius:0;box-shadow:none;touch-action:none}

<body>
<div id="app"><div class="arena-wrap"><canvas id="game"></canvas></div></div>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
const W=1529,H=688,wall=24,goalW=170,goalDepth=26;
// Keep the complete supplied arena image, including the player-name and score panels.
const FIELD={left:330,right:1240,top:113,bottom:677,goalTop:263,goalBottom:500};
let dpr=1,scale=1,offsetX=0,offsetY=0,scoreA=0,scoreB=0,turn='A',aim=null,selected=null,shots=0,particles=[],trails=[],soundOn=true,audio=null,toastTimer=0,settleTimer=0;
const bodies=[];
let screenState='teamSelect',chosenTeam=-1,opponentTeam=-1;
const teamChoices=[
 {name:'ESTEGHLAL',file:'teams/esteghlal.png',image:new Image()},
 {name:'PERSEPOLIS',file:'teams/Perspolis.png',image:new Image()},
 {name:'SEPAHAN',file:'teams/sepahan.png',image:new Image()},
 {name:'TRACTOR',file:'teams/teraktor.png',image:new Image()}
];
teamChoices.forEach(t=>{t.image.src=t.file});

const pieceFace=new Image(),pieceSide=new Image(),pieceTop=new Image();
pieceSide.src='piece-logo.png';
pieceFace.src='piece-side.png';
pieceTop.src='piece-top.png';
const ballTexture=new Image();ballTexture.src='ball_exact.jpg';
// Keep the original high-resolution arena artwork for maximum visual fidelity.
const fieldTexture=new Image();fieldTexture.src='1794090316714.jpg';

const make=(x,y,r,mass,color,kind)=>({x,y,vx:0,vy:0,r,mass,color,kind,inv:1/mass,spin:0,angle:0,frictionActive:false});
function setup(){
 bodies.length=0;
 bodies.push(make(W*.24,H/2,44.9064,5,'#53f5e8','strikerA'));
 bodies.push(make(W*.76,H/2,44.9064,5,'#ff4f9a','strikerB'));
 bodies.push(make((FIELD.left+FIELD.right)/2,(FIELD.top+FIELD.bottom)/2,13.2,.82,'#f5fbff','ball'));
 for(let i=0;i<4;i++){const y=H/2+(i-1.5)*76;bodies.push(make(W*.38,y,44.9064,5,'#1fb9c9','discA'));bodies.push(make(W*.62,y,44.9064,5,'#c73578','discB'));}
 particles=[];trails=[];aim=null;selected=null;turn='A';settleTimer=0;updateTurn();
}
function resize(){
 const rect=canvas.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);
 canvas.width=Math.max(1,Math.round(rect.width*dpr));canvas.height=Math.max(1,Math.round(rect.height*dpr));
 // Preserve the artwork's original proportions; enlarge uniformly to cover the screen.
 scale=Math.max(canvas.height/W,canvas.width/H);offsetX=(canvas.width-H*scale)/2;offsetY=(canvas.height-W*scale)/2;
}
function pos(e){const r=canvas.getBoundingClientRect();const sx=(e.clientX-r.left)*dpr,sy=(e.clientY-r.top)*dpr;return{x:(sy-offsetY)/scale,y:H-(sx-offsetX)/scale}}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function updateTurn(){}
function moving(){return bodies.some(b=>Math.hypot(b.vx,b.vy)>.8)}
function playTone(freq=260,dur=.06,type='sine',vol=.035){if(!soundOn)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.value=vol;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.stop(audio.currentTime+dur)}catch{}}
function burst(x,y,color,n=12){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=1+Math.random()*5;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:35+Math.random()*20,color,r:1+Math.random()*3})}}
function showToast(){}
function strike(b,dx,dy){const len=Math.hypot(dx,dy);if(len<2.5)return;const aimPct=clamp(len/150,0,1);const aimPower=Math.pow(aimPct,b.kind==='ball'?1.8:4.0);const power=1100*aimPower*(b.kind==='ball'?1.25:1)*1.10*1.5;b.vx=dx/len*power;b.vy=dy/len*power;b.spin=0;b.lowAimDrag=b.kind==='ball'?0:10*Math.pow(1-aimPct,2);b.frictionActive=false;b.ballCollisionCount=0;b.lastBallCollisionTick=-1;if(b.kind!=='ball'){const ball=bodies.find(body=>body.kind==='ball');if(ball){ball.frictionActive=false;ball.ballCollisionCount=0;ball._contactsLastTick=new Set();ball._contactsThisTick=new Set();}}turn=turn==='A'?'B':'A';shots++;updateTurn();playTone(180,.09,'triangle',.05);burst(b.x,b.y,b.color,7)}
const teamA=[0,3,5,7,9],teamB=[1,4,6,8,10];
// Clean aiming controller: one finger keeps the original pull-back gesture;
// with two fingers, movement from BOTH fingers contributes to the same aim vector.
// Two-control aiming: finger 1 sets pull strength; finger 2 sets shot direction.
const activePointers=new Set();
const touchPositions=new Map();
const pointerPositions=new Map();
let powerPointerId=null,directionPointerId=null;
let powerStart=null,powerLength=0,powerBase=0,powerRadialStart=0,powerRadialBase=0,directionUnit=null,directionTarget=null,twoFingerMode=false;
let dualPowerVector=null;
let pinchStartDistance=0,pinchStartAngle=0,pinchBasePower=0,pinchBaseDirection=0;
let gestureVector=null,gestureCancelled=false;
function screenPoint(clientX,clientY){
 const r=canvas.getBoundingClientRect();
 const sx=(clientX-r.left)*dpr,sy=(clientY-r.top)*dpr;
 return{x:(sy-offsetY)/scale,y:H-(sx-offsetX)/scale};
}
function refreshAim(){
 if(!selected||!directionUnit)return;
 const len=clamp(powerLength,0,150);
 gestureVector={x:directionUnit.x*len,y:directionUnit.y*len};
}
function resetTwoFingerBaseline(){
 if(powerPointerId===null||directionPointerId===null)return;
 const powerPoint=pointerPositions.get(powerPointerId),directionPoint=pointerPositions.get(directionPointerId);
 if(!powerPoint||!directionPoint)return;
 const dx=directionPoint.x-powerPoint.x,dy=directionPoint.y-powerPoint.y;
 pinchStartDistance=Math.hypot(dx,dy);
 pinchStartAngle=Math.atan2(dy,dx);
 pinchBasePower=powerLength;
 pinchBaseDirection=Math.atan2(directionUnit.y,directionUnit.x);
}
function beginAim(p,id){
 if(screenState==='teamSelect'){
  if(p.y>220&&p.y<505){
   const cardXs=[205,485,765,1045];
   for(let i=0;i<cardXs.length;i++){
    if(p.x>=cardXs[i]&&p.x<=cardXs[i]+235){chosenTeam=i;return;}
   }
  }
  if(chosenTeam>=0&&p.x>=570&&p.x<=960&&p.y>=555&&p.y<=635){
   opponentTeam=Math.floor(Math.random()*teamChoices.length);screenState='game';setup();return;
  }
  return;
 }

 if(activePointers.has(id)||activePointers.size>=2)return;
 if(activePointers.size===0){
  if(selected||moving()||turn!=='A')return;
  const hit=teamA.map(i=>bodies[i]).filter(b=>Math.hypot(p.x-b.x,p.y-b.y)<(b.r+18)*3)
   .sort((a,b)=>Math.hypot(p.x-a.x,p.y-a.y)-Math.hypot(p.x-b.x,p.y-b.y))[0];
  if(!hit)return;
  selected=hit;powerPointerId=id;
  // Preserve the original one-finger pull-back vector until a second finger is added.
  gestureVector={x:hit.x-p.x,y:hit.y-p.y};
  twoFingerMode=false;powerStart=p;powerBase=0;powerLength=0;powerRadialStart=0;powerRadialBase=0;directionUnit=null;directionTarget=null;
  gestureCancelled=false;aim={x:p.x,y:p.y};
 }else if(activePointers.size===1&&selected){
  // Reassign whichever control finger was lifted while the other one remains down.
  twoFingerMode=true;
  if(powerPointerId===null&&directionPointerId!==null){
   // A new finger takes over power, starting from the current aim magnitude.
   powerPointerId=id;
   dualPowerVector={x:gestureVector.x,y:gestureVector.y};
   powerLength=Math.hypot(dualPowerVector.x,dualPowerVector.y);
   powerRadialStart=Math.hypot(p.x-selected.x,p.y-selected.y);powerRadialBase=powerLength;
   powerStart=p;
  }else if(directionPointerId===null&&powerPointerId!==null){
   // Preserve the existing pull-back magnitude when finger 2 joins.
   dualPowerVector={x:gestureVector.x,y:gestureVector.y};
   powerLength=Math.hypot(dualPowerVector.x,dualPowerVector.y);
   const powerPoint=pointerPositions.get(powerPointerId);
   powerRadialStart=powerPoint?Math.hypot(powerPoint.x-selected.x,powerPoint.y-selected.y):0;
   powerRadialBase=powerLength;
   directionPointerId=id;
   // On the first join, finger 2 chooses direction. On rejoin, keep the previous direction.
   if(!directionUnit){
    const dx=p.x-selected.x,dy=p.y-selected.y,len=Math.hypot(dx,dy);
    if(len>3){directionTarget={x:dx,y:dy};directionUnit={x:dx/len,y:dy/len};}
    else{
     const currentLen=Math.hypot(gestureVector.x,gestureVector.y)||1;
     directionUnit={x:gestureVector.x/currentLen,y:gestureVector.y/currentLen};
     directionTarget={x:directionUnit.x*100,y:directionUnit.y*100};
    }
   }else if(!directionTarget){directionTarget={x:directionUnit.x*100,y:directionUnit.y*100};}
   refreshAim();
  }
 }
 activePointers.add(id);pointerPositions.set(id,p);
 if(twoFingerMode)resetTwoFingerBaseline();
}
function moveAim(id,p){
 if(!selected||!activePointers.has(id))return;
 if(!twoFingerMode){
  if(id===powerPointerId){
   // Keep the original one-finger aiming behavior unchanged.
   const previous=pointerPositions.get(id);
   if(previous){gestureVector.x-=(p.x-previous.x);gestureVector.y-=(p.y-previous.y);}
   aim={x:p.x,y:p.y};
  }
 }else if(id===powerPointerId||id===directionPointerId){
  // Both fingers jointly control power (distance) and direction (rotation).
  pointerPositions.set(id,p);
  const powerPoint=pointerPositions.get(powerPointerId),directionPoint=pointerPositions.get(directionPointerId);
  if(powerPoint&&directionPoint){
   const dx=directionPoint.x-powerPoint.x,dy=directionPoint.y-powerPoint.y;
   const distance=Math.hypot(dx,dy),angle=Math.atan2(dy,dx);
   powerLength=clamp(pinchBasePower+(distance-pinchStartDistance),0,150);
   const angleDelta=Math.atan2(Math.sin(angle-pinchStartAngle),Math.cos(angle-pinchStartAngle));
   const shotAngle=pinchBaseDirection+angleDelta;
   directionUnit={x:Math.cos(shotAngle),y:Math.sin(shotAngle)};
   refreshAim();
  }
  aim={x:p.x,y:p.y};
  return;
 }
 pointerPositions.set(id,p);
}
function finishAim(id,cancelled=false){
 if(!activePointers.has(id))return;
 if(cancelled)gestureCancelled=true;
 activePointers.delete(id);pointerPositions.delete(id);
 if(id===powerPointerId)powerPointerId=null;
 if(id===directionPointerId)directionPointerId=null;
 if(activePointers.size===1&&selected){
  // Fall back to one-finger aiming without ending the current shot.
  const remainingId=activePointers.values().next().value;
  const remainingPoint=pointerPositions.get(remainingId);
  powerPointerId=remainingId;directionPointerId=null;twoFingerMode=false;
  if(remainingPoint)aim={x:remainingPoint.x,y:remainingPoint.y};
 }else if(activePointers.size===0){
  if(!gestureCancelled&&selected&&gestureVector)strike(selected,gestureVector.x,gestureVector.y);
  selected=null;aim=null;powerPointerId=null;directionPointerId=null;
  powerStart=null;powerLength=0;powerBase=0;powerRadialStart=0;powerRadialBase=0;directionUnit=null;directionTarget=null;twoFingerMode=false;dualPowerVector=null;
  gestureVector=null;gestureCancelled=false;pointerPositions.clear();touchPositions.clear();
 }
}
canvas.addEventListener('touchstart',e=>{
 e.preventDefault();
 for(const t of e.changedTouches){
  const id='t'+t.identifier;if(activePointers.size>=2)continue;
  beginAim(screenPoint(t.clientX,t.clientY),id);
  if(activePointers.has(id))touchPositions.set(t.identifier,id);
 }
},{passive:false});
canvas.addEventListener('touchmove',e=>{
 e.preventDefault();
 for(const t of e.changedTouches){const id=touchPositions.get(t.identifier);if(id)moveAim(id,screenPoint(t.clientX,t.clientY));}
},{passive:false});
canvas.addEventListener('touchend',e=>{
 e.preventDefault();
 for(const t of e.changedTouches){const id=touchPositions.get(t.identifier);if(id){finishAim(id,false);touchPositions.delete(t.identifier);}}
},{passive:false});
canvas.addEventListener('touchcancel',e=>{
 for(const t of e.changedTouches){const id=touchPositions.get(t.identifier);if(id){finishAim(id,true);touchPositions.delete(t.identifier);}}
},{passive:false});
// Mouse/pen fallback; touch input is handled only by native touch events.
canvas.addEventListener('pointerdown',e=>{
 if(e.pointerType==='touch')return;
 beginAim(pos(e),e.pointerId);
 if(activePointers.has(e.pointerId)){try{canvas.setPointerCapture(e.pointerId)}catch{}}
});
window.addEventListener('pointermove',e=>{if(e.pointerType!=='touch')moveAim(e.pointerId,pos(e));},{capture:true});
window.addEventListener('pointerup',e=>{if(e.pointerType!=='touch')finishAim(e.pointerId,false);},{capture:true});
window.addEventListener('pointercancel',e=>{if(e.pointerType!=='touch')finishAim(e.pointerId,true);},{capture:true});
let physicsTick=0;
function physics(h){
  physicsTick++;
  for(const b of bodies)if(b.kind==='ball')b._contactsThisTick=new Set();
 // h is a fixed 1/120-second step. Velocities are pixels per second.
 for(const b of bodies){
  const speed=Math.hypot(b.vx,b.vy);
  if(speed>0&&b.kind!=='ball'&&!b.frictionActive&&b.lowAimDrag>0){
    // Gentle shots lose speed from the start, so they also travel a much shorter distance.
    const factor=Math.exp(-b.lowAimDrag*h);
    b.vx*=factor;b.vy*=factor;
   }
  if(speed>0&&b.frictionActive){
    // Normal rolling resistance after a collision with a piece or wall.
    const drag=b.kind==='ball'?1.71925:2.5;
    const factor=Math.exp(-drag*h);
    b.vx*=factor;b.vy*=factor;
   }
  // A small Magnus-like curve is driven by spin, not an arbitrary per-frame boost.
  if(b.kind==='ball'){
   const curve=clamp(b.spin*.00075,-.22,.22),vx=b.vx,vy=b.vy;
   b.vx+=-vy*curve*h;b.vy+=vx*curve*h;
  }
  b.x+=b.vx*h;b.y+=b.vy*h;
  b.angle+=(Math.hypot(b.vx,b.vy)/b.r+b.spin)*h;
  b.spin*=Math.exp(-(b.kind==='ball'?1.7:2.8)*h);
  if(Math.hypot(b.vx,b.vy)<1.2){b.vx=0;b.vy=0;b.spin=0}
  const inGoal=b.kind==='ball'&&b.y>FIELD.goalTop&&b.y<FIELD.goalBottom;
  // Four actual playing-field edges, not the outer canvas/image edges.
  if(b.x-b.r*.736<FIELD.left&&!(b.kind==='ball'&&inGoal)){b.x=FIELD.left+b.r*.736;markCollision(b,'wall-left');b.vx=Math.abs(b.vx)*(b.kind==='ball'?.92:.84);b.vy*=b.kind==='ball'?.997:.985;wallSpin(b,b.vy);wallFX(b.x,b.y)}
  if(b.x+b.r*.736>FIELD.right&&!(b.kind==='ball'&&inGoal)){b.x=FIELD.right-b.r*.736;markCollision(b,'wall-right');b.vx=-Math.abs(b.vx)*(b.kind==='ball'?.92:.84);b.vy*=b.kind==='ball'?.997:.985;wallSpin(b,b.vy);wallFX(b.x,b.y)}
  if(b.y-b.r*.736<FIELD.top){b.y=FIELD.top+b.r*.736;markCollision(b,'wall-top');b.vy=Math.abs(b.vy)*(b.kind==='ball'?.92:.84);b.vx*=b.kind==='ball'?.997:.985;wallSpin(b,b.vx);wallFX(b.x,b.y)}
  if(b.y+b.r*.736>FIELD.bottom){b.y=FIELD.bottom-b.r*.736;markCollision(b,'wall-bottom');b.vy=-Math.abs(b.vy)*(b.kind==='ball'?.92:.84);b.vx*=b.kind==='ball'?.997:.985;wallSpin(b,b.vx);wallFX(b.x,b.y)}
 }
 // Several solver passes resolve contact chains and remove residual overlap.
 for(let pass=0;pass<4;pass++)
  for(let i=0;i<bodies.length;i++)for(let j=i+1;j<bodies.length;j++)collide(bodies[i],bodies[j]);
 for(const b of bodies)if(b.kind==='ball')b._contactsLastTick=b._contactsThisTick;
 const ballSpeed=Math.hypot(bodies[2].vx,bodies[2].vy);
 if(ballSpeed>2310){bodies[2].vx*=2310/ballSpeed;bodies[2].vy*=2310/ballSpeed}
 const ball=bodies[2];
 if(ball.x>FIELD.right+ball.r*.5){scoreA++;goal('A')}
 else if(ball.x<FIELD.left-ball.r*.5){scoreB++;goal('B')}
}
function markCollision(b,key='wall'){b.frictionActive=true;if(b.kind==='ball'){const current=b._contactsThisTick||new Set();current.add(key);}}
function wallSpin(b,tangentSpeed){
 // Visual spin only: it never changes the body's travel speed or direction.
 b.spin+=clamp(tangentSpeed*.018,-9,9)*(b.kind==='ball'?1.0:.7);
}
function wallFX(x,y){if(Math.random()<.09)burst(x,y,'#53f5e8',3)}
function collide(a,b){
 let dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy),min=(a.r+b.r)*.736;
 if(dist>=min)return;
 if(dist<1e-8){dx=1;dy=0;dist=1}
 const nx=dx/dist,ny=dy/dist,overlap=min-dist,total=a.inv+b.inv;
 const correction=Math.max(overlap-.02,0)*.78/total;
 a.x-=nx*correction*a.inv;a.y-=ny*correction*a.inv;
 b.x+=nx*correction*b.inv;b.y+=ny*correction*b.inv;
 const rvx=b.vx-a.vx,rvy=b.vy-a.vy,normalSpeed=rvx*nx+rvy*ny;
 if(normalSpeed>=0)return;
 const ballContact=a.kind==='ball'||b.kind==='ball';
 const restitution=ballContact?.92:.86;
 const j=-(1+restitution)*normalSpeed/total;
 a.vx-=j*a.inv*nx;a.vy-=j*a.inv*ny;
 b.vx+=j*b.inv*nx;b.vy+=j*b.inv*ny;
  if(a.kind==='ball')markCollision(a,'body:'+bodies.indexOf(b));
  if(b.kind==='ball')markCollision(b,'body:'+bodies.indexOf(a));
  if(a.kind!=='ball')markCollision(a);
  if(b.kind!=='ball')markCollision(b);
 // Collision adds restrained visual spin without applying tangential
 // impulses to linear velocity, preserving the existing gameplay friction.
 const tx=-ny,ty=nx,ra=a.r,rb=b.r;
 const tangentSpeed=rvx*tx+rvy*ty;
 const spinKick=clamp(tangentSpeed*.012,-7,7);
 a.spin-=spinKick*(ballContact?1.0:.7);
 b.spin+=spinKick*(ballContact?1.0:.7);
 if(j>95){playTone(clamp(105+j*.20,120,420),.035,'sine',.01);if(j>230)burst((a.x+b.x)/2,(a.y+b.y)/2,'#d8ffff',4)}
}
function goal(who){burst(W/2,who==='A'?18:H-18,who==='A'?'#53f5e8':'#ff4f9a',42);playTone(520,.28,'sawtooth',.04);setup();}
function ai(){
 if(turn!=='B'||moving()||aim)return;
 const ball=bodies[2];
 // The opponent can choose any of its four discs, not just its starting striker.
 const striker=teamB.map(i=>bodies[i]).sort((a,b)=>Math.hypot(a.x-ball.x,a.y-ball.y)-Math.hypot(b.x-ball.x,b.y-ball.y))[0];
 const dx=ball.x+58-striker.x,dy=ball.y-striker.y;
 const len=Math.hypot(dx,dy)||1;
 strike(striker,dx/len*108,dy/len*108);
}
function drawArenaEdits(){
// Rebuild only the top HUD. The original pitch and side artwork remain untouched.
 const grad=(x,y,w,h,stops,vertical=true)=>{
  const g=vertical?ctx.createLinearGradient(x,y,x,y+h):ctx.createLinearGradient(x,y,x+w,y);
  for(const [p,c] of stops)g.addColorStop(p,c);
  return g;
 };
 const path=(pts,fill,stroke='#171717',lw=2)=>{
  ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.closePath();ctx.fillStyle=fill;ctx.fill();
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}
 };
 const round=(x,y,w,h,r,fill,stroke='#5a554b',lw=2)=>{
  ctx.beginPath();roundedRectPath(ctx,x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}
 };
 // Dark steel header base with a subtle brushed highlight and lower bevel.
 ctx.fillStyle=grad(0,0,1529,101,[[0,'#080909'],[.18,'#222321'],[.52,'#151615'],[.82,'#090a09'],[1,'#030404']]);
 ctx.fillRect(0,0,1529,101);
 ctx.fillStyle='rgba(255,255,255,.10)';ctx.fillRect(0,0,1529,2);
 ctx.fillStyle='rgba(255,255,255,.055)';ctx.fillRect(0,3,1529,1);
 ctx.fillStyle='#050606';ctx.fillRect(0,96,1529,5);
 ctx.fillStyle='rgba(205,180,121,.16)';ctx.fillRect(0,99,1529,1);
 // Long silver player-name plates, left and right, deliberately blank.
 path([[238,0],[617,0],[645,30],[622,68],[260,68]],grad(238,0,407,68,[[0,'#f1f1ee'],[.24,'#d8d8d4'],[.7,'#a9aaa6'],[1,'#777873']]),'#4c4b46',2);
 path([[1291,0],[912,0],[884,30],[907,68],[1269,68]],grad(884,0,407,68,[[0,'#777873'],[.3,'#a9aaa6'],[.75,'#d8d8d4'],[1,'#f1f1ee']]),'#4c4b46',2);
 // Fine bevel highlights on both name plates.
 ctx.strokeStyle='rgba(255,255,255,.52)';ctx.lineWidth=1;
 ctx.beginPath();ctx.moveTo(247,2);ctx.lineTo(613,2);ctx.lineTo(637,29);ctx.stroke();
 ctx.beginPath();ctx.moveTo(1282,2);ctx.lineTo(916,2);ctx.lineTo(892,29);ctx.stroke();
 // Level labels and star emblems are intentionally omitted; both silver panels remain blank.

function roundedRectPath(context,x,y,w,h,r){

}
function drawTeamSelection(){

  const im=team.image;
  if(im.complete&&im.naturalWidth){

function draw(){
 if(screenState==='teamSelect'){
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='#061523';ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.save();ctx.translate(canvas.width-offsetX,offsetY);ctx.rotate(Math.PI/2);ctx.scale(scale,scale);
  drawTeamSelection();
  ctx.restore();return;
 }

 ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);
 ctx.fillStyle='#061523';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.save();ctx.translate(canvas.width-offsetX,offsetY);ctx.rotate(Math.PI/2);ctx.scale(scale,scale);
 if(fieldTexture.complete&&fieldTexture.naturalWidth){ctx.drawImage(fieldTexture,0,0,W,H)}else{ctx.fillStyle='#176b42';ctx.fillRect(0,0,W,H)}
 drawArenaEdits();
 for(const t of trails){ctx.globalAlpha=t.life/18*.18;ctx.fillStyle=t.color;ctx.beginPath();ctx.arc(t.x,t.y,t.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
 // TEMP DEBUG: show the exact collision radius used by the physics solver.
 ctx.save();ctx.strokeStyle='#168cff';ctx.lineWidth=3;ctx.setLineDash([3,7]);ctx.globalAlpha=.95;
 for(const b of bodies){ctx.beginPath();ctx.arc(b.x,b.y,b.r*.736,0,Math.PI*2);ctx.stroke();}
 ctx.setLineDash([]);ctx.restore();
 for(const b of bodies){
  if(b===selected){ctx.strokeStyle='#ffffff';ctx.lineWidth=3;ctx.shadowColor=b.color;ctx.shadowBlur=18;ctx.beginPath();ctx.arc(b.x,b.y,b.r+7,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0}
  if(Math.hypot(b.vx,b.vy)>.6&&b.kind==='ball'){trails.push({x:b.x,y:b.y,r:b.r*.8,color:'#d9ffff',life:18})}
  ctx.save();ctx.shadowColor=b.color;ctx.shadowBlur=b.kind==='ball'?22:15;
  if(b.kind==='ball'){
   ctx.shadowBlur=0;
   if(ballTexture.complete&&ballTexture.naturalWidth){
    ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.angle);
    ctx.beginPath();ctx.arc(0,0,b.r,0,Math.PI*2);ctx.clip();
    ctx.drawImage(ballTexture,-b.r,-b.r,b.r*2,b.r*2);
    ctx.restore();
   }
  }else{
   ctx.shadowBlur=0;
   // The side layer follows the disc position without rotating.
   if(pieceSide.complete&&pieceSide.naturalWidth){
    // Show only the lower half of the fixed side layer; the face covers the seam.
    ctx.save();
    ctx.beginPath();
    ctx.rect(b.x-b.r,b.y,b.r*2,b.r+9.8176);
    ctx.clip();
    ctx.drawImage(pieceSide,b.x-b.r,b.y-b.r-3.488,b.r*2,b.r*2+13.3056);
    ctx.restore();
   }
    // The face layer rotates with the disc.
    ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.angle);
    ctx.beginPath();ctx.arc(0,0,b.r,0,Math.PI*2);ctx.clip();
    const isPlayerPiece=b.kind==='strikerA'||b.kind==='discA';
    const isOpponentPiece=b.kind==='strikerB'||b.kind==='discB';
    const faceImage=isPlayerPiece&&chosenTeam>=0?teamChoices[chosenTeam].image:isOpponentPiece&&opponentTeam>=0?teamChoices[opponentTeam].image:pieceFace;
    if(faceImage.complete&&faceImage.naturalWidth){
     ctx.drawImage(faceImage,-b.r,-b.r,b.r*2,b.r*2);
    }else{
     ctx.fillStyle='#d9d9d9';ctx.fill();
    }
    // Darken only the AI club-logo face, matching its exact circular bounds.
    if(isOpponentPiece&&chosenTeam>=0&&opponentTeam===chosenTeam){
     ctx.beginPath();ctx.arc(0,0,b.r*0.72,0,Math.PI*2);ctx.clip();
     ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(-b.r*0.72,-b.r*0.72,b.r*1.44,b.r*1.44);
    }
    ctx.restore();
    // The top overlay follows the disc but stays upright (no rotation).
    if(pieceTop.complete&&pieceTop.naturalWidth){
     ctx.save();ctx.translate(b.x,b.y);
     ctx.beginPath();ctx.arc(0,0,b.r,0,Math.PI*2);ctx.clip();
     ctx.drawImage(pieceTop,-b.r,-b.r,b.r*2,b.r*2);
     ctx.restore();
    }
    ctx.restore();continue;
  }
  ctx.restore();
 }
 if(selected&&gestureVector){
