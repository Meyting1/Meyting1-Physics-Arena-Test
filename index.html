<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07111f">
<title>NEON PITCH — Match</title>
<style>
:root{color-scheme:dark;--muted:#aab4ad}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 0%,#28332c 0,#101512 70%);font-family:Inter,system-ui,Segoe UI,sans-serif;color:#f4f5ef;touch-action:none}
#app{height:100%;display:flex;flex-direction:column;max-width:1180px;margin:auto;padding:8px;gap:8px}
.matchbar{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:6px;min-height:72px;padding:7px 10px;background:linear-gradient(180deg,#e7e7e4,#aaa9a4 52%,#292a28 53%,#171816);border:2px solid #756d56;border-radius:7px;box-shadow:0 5px 18px #0008;color:#20211f}
.player{display:flex;align-items:center;gap:8px;min-width:0}.player-right{justify-content:flex-end;text-align:right}
.player-info{min-width:0}.player-name{font-weight:900;font-size:clamp(11px,2.6vw,16px);letter-spacing:.04em;white-space:nowrap}.club-name{font-size:9px;font-weight:800;letter-spacing:.12em;color:#454a43;margin-top:3px}
.avatar{width:46px;height:46px;flex:0 0 46px;border:3px solid #c4b58a;border-radius:5px;background:linear-gradient(145deg,#f7f7f2,#9b9c96);box-shadow:0 1px 5px #0008;display:grid;place-items:center;overflow:hidden}.avatar{font-weight:1000;font-size:22px;text-shadow:0 1px 3px #0009}.avatar-a{color:#fff;background:radial-gradient(circle at 30% 25%,#73b9ff,#155ba5 65%,#082c57)}.avatar-b{color:#fff;background:radial-gradient(circle at 30% 25%,#ff8989,#c91e2d 65%,#650e18)}
.match-center{min-width:92px;padding:3px 10px;text-align:center;background:linear-gradient(180deg,#333430,#11120f);border:1px solid #706d62;border-radius:0 0 8px 8px;color:#fff;align-self:stretch;display:flex;flex-direction:column;justify-content:center;box-shadow:0 3px 7px #0008}
.scoreline{display:flex;align-items:center;justify-content:center;gap:12px;font-weight:900;font-size:clamp(24px,5vw,34px);font-variant-numeric:tabular-nums}.scoreline span{color:#a8a79f;font-size:20px}.stake-slot{height:12px;margin-top:2px;font-size:9px;color:#d9d8d0}#turn{font-size:9px;color:#d5d8cf;letter-spacing:.08em;margin-top:2px}
.arena-wrap{position:relative;flex:1;min-height:0;width:100%;aspect-ratio:820/520;max-height:calc(100vh - 128px);display:flex;align-items:center;justify-content:center}
canvas{display:block;width:100%;height:100%;max-height:100%;border-radius:5px;box-shadow:0 12px 32px #0009;touch-action:none}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}.toast{background:#101713ed;border:1px solid #f0d38a;border-radius:10px;padding:12px 18px;text-align:center;box-shadow:0 0 24px #0008;opacity:0;transform:translateY(8px);transition:.2s}.toast.show{opacity:1;transform:translateY(0)}.toast b{display:block;color:#f6d98e;font-size:18px}
.controls{display:flex;justify-content:space-between;align-items:center;gap:8px;color:#c0c8bd;font-size:11px;min-height:34px}button{border:1px solid #756c54;background:linear-gradient(180deg,#393a34,#1d201c);color:#f7f4e9;padding:8px 12px;border-radius:7px;font-weight:800;font-size:11px}button:active{transform:scale(.97)}.hint{line-height:1.35;max-width:72%}
@media(max-width:420px){#app{padding:5px;gap:5px}.matchbar{min-height:62px;padding:5px}.avatar{width:36px;height:36px;flex-basis:36px}.player{gap:5px}.club-name{font-size:8px}.match-center{min-width:72px;padding:2px 6px}.scoreline{gap:8px}.arena-wrap{max-height:calc(100vh - 108px)}.controls{font-size:9px}}
@media(min-width:700px){#app{padding:12px}.controls{font-size:12px}}
</style>
</head>
<body>
<div id="app">
<div class="matchbar">
 <div class="player player-left"><div class="avatar avatar-a" aria-label="Esteghlal">E</div><div class="player-info"><div class="player-name">PLAYER 1</div><div class="club-name">ESTEGHLAL</div></div></div>
 <div class="match-center"><div class="scoreline"><strong id="scoreA">0</strong><span>:</span><strong id="scoreB">0</strong></div><div class="stake-slot"></div><div id="turn">YOUR TURN</div></div>
 <div class="player player-right"><div class="player-info"><div class="player-name">PLAYER 2</div><div class="club-name">PERSEPOLIS</div></div><div class="avatar avatar-b" aria-label="Persepolis">P</div></div>
</div>
<div class="arena-wrap"><canvas id="game"></canvas><div class="overlay"><div class="toast" id="toast"><b id="toastTitle">GOAL!</b><span id="toastSub">Nice shot</span></div></div></div>
<div class="controls"><div class="hint">Drag back from your team token to aim, then release.</div><div style="display:flex;gap:6px"><button id="reset">RESTART</button><button id="sound">SOUND: ON</button></div></div>
</div>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
const W=820,H=520,wall=20,goalW=166,goalDepth=26;
let dpr=1,scale=1,ox=0,oy=0,scoreA=0,scoreB=0,turn='A',aim=null,selected=null,shots=0,particles=[],trails=[],soundOn=true,audio=null,toastTimer=0,settleTimer=0;
const bodies=[];
const make=(x,y,r,mass,color,kind)=>({x,y,vx:0,vy:0,r,mass,color,kind,inv:1/mass,spin:0,angle:0});
function setup(){
 bodies.length=0;
 bodies.push(make(W*.22,H/2,27,5,'#1559a5','strikerA'));
 bodies.push(make(W*.78,H/2,27,5,'#c92832','strikerB'));
 bodies.push(make(W/2,H/2,10,.82,'#f5fbff','ball'));
 for(let i=0;i<3;i++){bodies.push(make(W*.37,H/2+(i-1)*54,22,5,'#1559a5','discA'));bodies.push(make(W*.63,H/2+(i-1)*54,22,5,'#c92832','discB'));}
 particles=[];trails=[];aim=null;selected=null;turn='A';settleTimer=0;updateTurn();
}
function resize(){
 const rect=canvas.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);
 canvas.width=Math.max(1,Math.round(rect.width*dpr));canvas.height=Math.max(1,Math.round(rect.height*dpr));
 scale=Math.min(canvas.width/W,canvas.height/H);ox=(canvas.width-W*scale)/2;oy=(canvas.height-H*scale)/2;
}
function pos(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*dpr/scale-ox/scale,y:(e.clientY-r.top)*dpr/scale-oy/scale}}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function updateTurn(){$('turn').textContent=turn==='A'?'YOUR TURN':'OPPONENT TURN';}
function moving(){return bodies.some(b=>Math.hypot(b.vx,b.vy)>.8)}
function playTone(freq=260,dur=.06,type='sine',vol=.035){if(!soundOn)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.value=vol;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.stop(audio.currentTime+dur)}catch{}}
function burst(x,y,color,n=12){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=1+Math.random()*5;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:35+Math.random()*20,color,r:1+Math.random()*3})}}
function showToast(title,sub){$('toastTitle').textContent=title;$('toastSub').textContent=sub;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),1500)}
function strike(b,dx,dy){const len=Math.hypot(dx,dy);if(len<2.5)return;const aimPct=clamp(len/150,0,1);const power=1100*Math.pow(aimPct,1.8)*(b.kind==='ball'?1.25:1);b.vx=dx/len*power;b.vy=dy/len*power;b.spin=0;turn=turn==='A'?'B':'A';shots++;updateTurn();playTone(180,.09,'triangle',.05);burst(b.x,b.y,b.color,7)}
const teamA=[0,3,5,7],teamB=[1,4,6,8];
canvas.addEventListener('pointerdown',e=>{
 if(moving()||turn!=='A')return;
 const p=pos(e);
 let hit=teamA.map(i=>bodies[i]).filter(b=>Math.hypot(p.x-b.x,p.y-b.y)<b.r+18)
   .sort((a,b)=>Math.hypot(p.x-a.x,p.y-a.y)-Math.hypot(p.x-b.x,p.y-b.y))[0];
 if(hit){selected=hit;aim={x:p.x,y:p.y};canvas.setPointerCapture(e.pointerId)}
});
canvas.addEventListener('pointermove',e=>{if(aim&&selected){const p=pos(e);aim.x=p.x;aim.y=p.y;const distance=Math.hypot(selected.x-p.x,selected.y-p.y);if(distance<=24){aim=null;selected=null;if(canvas.hasPointerCapture(e.pointerId))canvas.releasePointerCapture(e.pointerId);}}});
canvas.addEventListener('pointerup',e=>{
 if(!aim||!selected)return;
 const p=pos(e),b=selected,dx=b.x-p.x,dy=b.y-p.y;
 strike(b,dx,dy);aim=null;selected=null;
});
canvas.addEventListener('pointercancel',()=>{aim=null;selected=null});
function physics(h){
 // h is a fixed 1/120-second step. Velocities are pixels per second.
 for(const b of bodies){
  const speed=Math.hypot(b.vx,b.vy);
  if(speed>0){
   // Smooth rolling resistance: retain more speed at the start, then
   // let the motion ease naturally into a stop instead of losing a
   // fixed amount of speed every frame.
   const drag=b.kind==='ball'?1.15:2.5;
   const factor=Math.exp(-drag*h);
   b.vx*=factor;b.vy*=factor;
  }
  // A small Magnus-like curve is driven by spin, not an arbitrary per-frame boost.
  if(b.kind==='ball'){
   const curve=clamp(b.spin*.00075,-.22,.22),vx=b.vx,vy=b.vy;
   b.vx+=-vy*curve*h;b.vy+=vx*curve*h;
  }
  b.x+=b.vx*h;b.y+=b.vy*h;
  b.angle+=(Math.hypot(b.vx,b.vy)/b.r+b.spin)*h;
  b.spin*=Math.exp(-(b.kind==='ball'?1.7:2.8)*h);
  if(Math.hypot(b.vx,b.vy)<1.2){b.vx=0;b.vy=0;b.spin=0}
  const inGoal=b.kind==='ball'&&b.y>H/2-goalW/2+b.r*.25&&b.y<H/2+goalW/2-b.r*.25;
  if(b.x-b.r<wall&&!inGoal){b.x=wall+b.r;b.vx=Math.abs(b.vx)*(b.kind==='ball'?.92:.84);b.vy*=b.kind==='ball'?.997:.985;wallFX(b.x,b.y)}
  if(b.x+b.r>W-wall&&!inGoal){b.x=W-wall-b.r;b.vx=-Math.abs(b.vx)*(b.kind==='ball'?.92:.84);b.vy*=b.kind==='ball'?.997:.985;wallFX(b.x,b.y)}
  if(b.y-b.r<wall){b.y=wall+b.r;b.vy=Math.abs(b.vy)*(b.kind==='ball'?.92:.84);b.vx*=b.kind==='ball'?.997:.985;wallFX(b.x,b.y)}
  if(b.y+b.r>H-wall){b.y=H-wall-b.r;b.vy=-Math.abs(b.vy)*(b.kind==='ball'?.92:.84);b.vx*=b.kind==='ball'?.997:.985;wallFX(b.x,b.y)}
 }
 // Several solver passes resolve contact chains and remove residual overlap.
 for(let pass=0;pass<4;pass++)
  for(let i=0;i<bodies.length;i++)for(let j=i+1;j<bodies.length;j++)collide(bodies[i],bodies[j]);
 const ballSpeed=Math.hypot(bodies[2].vx,bodies[2].vy);
 if(ballSpeed>1400){bodies[2].vx*=1400/ballSpeed;bodies[2].vy*=1400/ballSpeed}
 const ball=bodies[2];
 if(ball.x>W+ball.r*.5){scoreA++;goal('A')}
 else if(ball.x<-ball.r*.5){scoreB++;goal('B')}
}
function wallFX(x,y){if(Math.random()<.09)burst(x,y,'#53f5e8',3)}
function collide(a,b){
 let dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy),min=a.r+b.r;
 if(dist>=min)return;
 if(dist<1e-8){dx=1;dy=0;dist=1}
 const nx=dx/dist,ny=dy/dist,overlap=min-dist,total=a.inv+b.inv;
 const correction=Math.max(overlap-.02,0)*.78/total;
 a.x-=nx*correction*a.inv;a.y-=ny*correction*a.inv;
 b.x+=nx*correction*b.inv;b.y+=ny*correction*b.inv;
 const rvx=b.vx-a.vx,rvy=b.vy-a.vy,normalSpeed=rvx*nx+rvy*ny;
 if(normalSpeed>=0)return;
 const ballContact=a.kind==='ball'||b.kind==='ball';
 const restitution=ballContact?.92:.86;
 const j=-(1+restitution)*normalSpeed/total;
 a.vx-=j*a.inv*nx;a.vy-=j*a.inv*ny;
 b.vx+=j*b.inv*nx;b.vy+=j*b.inv*ny;
 // Coulomb friction uses contact-point velocity, including each body's rotation.
 const tx=-ny,ty=nx,ra=a.r,rb=b.r;
 const wa=a.spin||0,wb=b.spin||0;
 const tangentSpeed=(rvx*tx+rvy*ty)-wa*ra-wb*rb;
 const ia=2/(a.mass*ra*ra),ib=2/(b.mass*rb*rb);
 const jt=-tangentSpeed/(total+ra*ra*ia+rb*rb*ib);
 const mu=ballContact?.12:.20;
 const friction=clamp(jt,-mu*j,mu*j);
 a.vx-=friction*a.inv*tx;a.vy-=friction*a.inv*ty;
 b.vx+=friction*b.inv*tx;b.vy+=friction*b.inv*ty;
 a.spin-=friction*ra*ia;b.spin-=friction*rb*ib;
 if(j>95){playTone(clamp(105+j*.20,120,420),.035,'sine',.01);if(j>230)burst((a.x+b.x)/2,(a.y+b.y)/2,'#d8ffff',4)}
}
function goal(who){if(who==='A'){$('scoreA').textContent=scoreA}else{$('scoreB').textContent=scoreB}
 burst(W/2,who==='A'?18:H-18,who==='A'?'#53f5e8':'#ff4f9a',42);playTone(520,.28,'sawtooth',.04);showToast(who==='A'?'GOAL!':'OPPONENT SCORES',who==='A'?'Clean finish':'Keep going');setup();$('scoreA').textContent=scoreA;$('scoreB').textContent=scoreB;}
function ai(){
 if(turn!=='B'||moving()||aim)return;
 const ball=bodies[2];
 // The opponent can choose any of its four discs, not just its starting striker.
 const striker=teamB.map(i=>bodies[i]).sort((a,b)=>Math.hypot(a.x-ball.x,a.y-ball.y)-Math.hypot(b.x-ball.x,b.y-ball.y))[0];
 const targetX=ball.x-72;
 const dx=targetX-striker.x,dy=ball.y-striker.y;
 const len=Math.hypot(dx,dy)||1;
 strike(striker,dx/len*108,dy/len*108);
}
function drawTeamToken(b,team){
 const a=team==='A',main=a?'#145ba6':'#c91e2d',dark=a?'#082e5c':'#620d18';
 ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.angle*.12);ctx.shadowColor='#000';ctx.shadowBlur=7;ctx.shadowOffsetY=3;
 const metal=ctx.createLinearGradient(-b.r,-b.r,b.r,b.r);metal.addColorStop(0,'#f4f3e9');metal.addColorStop(.35,'#858b8d');metal.addColorStop(.7,'#f4f4ed');metal.addColorStop(1,'#555b5d');
 ctx.fillStyle=metal;ctx.beginPath();ctx.arc(0,0,b.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.shadowOffsetY=0;ctx.strokeStyle='#fff';ctx.lineWidth=1.4;ctx.stroke();
 const face=ctx.createRadialGradient(-b.r*.28,-b.r*.35,1,0,0,b.r*.82);face.addColorStop(0,a?'#5ca2e2':'#ff7070');face.addColorStop(.55,main);face.addColorStop(1,dark);
 ctx.fillStyle=face;ctx.beginPath();ctx.arc(0,0,b.r*.83,0,Math.PI*2);ctx.fill();ctx.strokeStyle=a?'#c9e8ff':'#ffd8d8';ctx.lineWidth=Math.max(1,b.r*.07);ctx.stroke();
 ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='900 '+Math.max(5,b.r*.23)+'px system-ui';ctx.fillText(a?'EST.':'PER.',0,-b.r*.49);
 ctx.strokeStyle='#fff';ctx.lineWidth=Math.max(1.2,b.r*.09);ctx.lineCap='round';ctx.lineJoin='round';
 if(a){ctx.beginPath();ctx.arc(-b.r*.19,b.r*.02,b.r*.22,-.95,1);ctx.arc(b.r*.19,b.r*.02,b.r*.22,2.1,4.05);ctx.arc(0,b.r*.02,b.r*.22,0,Math.PI*2);ctx.stroke()}
 else{ctx.beginPath();ctx.moveTo(-b.r*.35,b.r*.22);ctx.lineTo(-b.r*.25,-b.r*.08);ctx.lineTo(-b.r*.08,b.r*.05);ctx.lineTo(0,-b.r*.22);ctx.lineTo(b.r*.08,b.r*.05);ctx.lineTo(b.r*.25,-b.r*.08);ctx.lineTo(b.r*.35,b.r*.22);ctx.stroke();ctx.beginPath();ctx.moveTo(-b.r*.22,b.r*.25);ctx.lineTo(b.r*.22,b.r*.25);ctx.stroke()}
 ctx.fillStyle='#fff';ctx.font='900 '+Math.max(5,b.r*.20)+'px system-ui';ctx.fillText(a?'1945':'1967',0,b.r*.51);ctx.restore();
}
function drawClassicBall(b){
 ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.angle);const r=b.r;
 const sphere=ctx.createRadialGradient(-r*.36,-r*.42,1,0,0,r);sphere.addColorStop(0,'#fff');sphere.addColorStop(.72,'#e8e8e5');sphere.addColorStop(1,'#a8aaa7');
 ctx.fillStyle=sphere;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();ctx.save();ctx.beginPath();ctx.arc(0,0,r*.91,0,Math.PI*2);ctx.clip();ctx.fillStyle='#171918';
 const pent=(x,y,rr,rot=0)=>{ctx.beginPath();for(let k=0;k<5;k++){const an=rot-k*Math.PI*2/5-Math.PI/2,px=x+Math.cos(an)*rr,py=y+Math.sin(an)*rr;k?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.closePath();ctx.fill()};
 pent(0,0,r*.30);for(let k=0;k<5;k++){const an=k*Math.PI*2/5-Math.PI/2;pent(Math.cos(an)*r*.70,Math.sin(an)*r*.70,r*.20,an*.3)}
 ctx.strokeStyle='#5b5d5b';ctx.lineWidth=Math.max(.7,r*.025);ctx.beginPath();ctx.arc(0,0,r*.88,0,Math.PI*2);ctx.stroke();ctx.restore();ctx.restore();
}
function draw(){
 ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#172219';ctx.fillRect(ox,oy,W*scale,H*scale);ctx.save();ctx.translate(ox,oy);ctx.scale(scale,scale);
 const grass=ctx.createLinearGradient(0,0,0,H);grass.addColorStop(0,'#147443');grass.addColorStop(.5,'#0b5e34');grass.addColorStop(1,'#0a512d');ctx.fillStyle=grass;ctx.fillRect(0,0,W,H);
 for(let i=0;i<10;i++){ctx.fillStyle=i%2?'#ffffff09':'#002e160e';ctx.fillRect(i*W/10,0,W/10,H)}
 ctx.strokeStyle='#b8954d';ctx.lineWidth=9;ctx.strokeRect(5,5,W-10,H-10);ctx.strokeStyle='#f4f0d5';ctx.lineWidth=2.2;ctx.strokeRect(wall,wall,W-2*wall,H-2*wall);
 ctx.beginPath();ctx.moveTo(W/2,wall);ctx.lineTo(W/2,H-wall);ctx.stroke();ctx.beginPath();ctx.arc(W/2,H/2,76,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#f6f2df';ctx.beginPath();ctx.arc(W/2,H/2,4,0,Math.PI*2);ctx.fill();
 ctx.strokeRect(wall,H/2-116,102,232);ctx.strokeRect(W-wall-102,H/2-116,102,232);ctx.strokeRect(wall,H/2-65,46,130);ctx.strokeRect(W-wall-46,H/2-65,46,130);
 ctx.beginPath();ctx.arc(wall+73,H/2,3,0,Math.PI*2);ctx.arc(W-wall-73,H/2,3,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#b18a42';ctx.fillRect(0,H/2-goalW/2-7,wall+4,goalW+14);ctx.fillStyle='#b9c0b6';ctx.fillRect(0,H/2-goalW/2,wall-5,goalW);
 ctx.fillStyle='#b18a42';ctx.fillRect(W-wall-4,H/2-goalW/2-7,wall+4,goalW+14);ctx.fillStyle='#b9c0b6';ctx.fillRect(W-wall+5,H/2-goalW/2,wall-5,goalW);
 ctx.strokeStyle='#f5e6b5';ctx.lineWidth=1;ctx.strokeRect(1,H/2-goalW/2,wall-5,goalW);ctx.strokeRect(W-wall+5,H/2-goalW/2,wall-6,goalW);
 for(const t of trails){ctx.globalAlpha=t.life/18*.18;ctx.fillStyle=t.color;ctx.beginPath();ctx.arc(t.x,t.y,t.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
 for(const b of bodies){if(b===selected){ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.shadowColor=b.color;ctx.shadowBlur=18;ctx.beginPath();ctx.arc(b.x,b.y,b.r+7,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0}
  if(Math.hypot(b.vx,b.vy)>.6&&b.kind==='ball')trails.push({x:b.x,y:b.y,r:b.r*.8,color:'#fff',life:18});
  if(b.kind==='ball')drawClassicBall(b);else drawTeamToken(b,b.kind.endsWith('A')?'A':'B')}
 if(aim&&selected){const b=selected,dx=b.x-aim.x,dy=b.y-aim.y,len=Math.hypot(dx,dy),power=Math.min(len,150);ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.setLineDash([9,8]);ctx.globalAlpha=.8;ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x+dx*.85,b.y+dy*.85);ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;ctx.fillStyle='#fff';ctx.globalAlpha=.12+power/190;ctx.beginPath();ctx.arc(b.x,b.y,b.r+10,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;ctx.fillStyle='#fff';ctx.font='bold 13px system-ui';ctx.fillText('POWER '+Math.round(power/150*100)+'%',b.x+35,b.y-34)}
