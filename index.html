<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07111f">
<title>NEON PITCH — Physics Lab</title>
<style>
:root{color-scheme:dark;--bg:#07111f;--panel:#0d1b2b;--cyan:#53f5e8;--pink:#ff4f9a;--muted:#91a9bd}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 0%,#122b40 0,#07111f 58%);font-family:Inter,system-ui,Segoe UI,sans-serif;color:#eaf8ff;touch-action:none}
#app{height:100%;display:flex;flex-direction:column;max-width:900px;margin:auto;padding:12px;gap:10px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-weight:900;letter-spacing:.17em;font-size:clamp(16px,4vw,22px)}.brand span{color:var(--cyan);text-shadow:0 0 16px #53f5e877}
#status{font-size:12px;color:var(--muted);text-align:right}
.hud{display:flex;align-items:center;justify-content:space-between;background:#0c1b2bcc;border:1px solid #244156;border-radius:14px;padding:9px 13px;box-shadow:0 8px 30px #0003}
.score{display:flex;align-items:center;gap:10px;font-weight:800}.score strong{font-size:24px;font-variant-numeric:tabular-nums}.team{font-size:11px;letter-spacing:.12em;color:var(--muted)}
#turn{font-size:11px;color:var(--cyan);letter-spacing:.1em}
.arena-wrap{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;width:100%;height:100%;max-height:100%;border-radius:18px;box-shadow:0 18px 60px #0008;touch-action:none}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.toast{background:#061321e8;border:1px solid #53f5e877;border-radius:14px;padding:12px 18px;text-align:center;box-shadow:0 0 30px #53f5e822;opacity:0;transform:translateY(8px);transition:.2s}
.toast.show{opacity:1;transform:translateY(0)}.toast b{display:block;color:var(--cyan);font-size:18px}
.controls{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);font-size:11px}
button{border:1px solid #2a5064;background:linear-gradient(180deg,#153047,#0d2031);color:#eaf8ff;padding:10px 14px;border-radius:11px;font-weight:700;font-size:12px}
button:active{transform:scale(.97)}.hint{line-height:1.45;max-width:65%}
@media(min-width:650px){#app{padding:18px}.controls{font-size:12px}}
</style>
</head>
<body>
<div id="app">
<header><div class="brand">NEON <span>PITCH</span></div><div id="status">PHYSICS LAB · PROTOTYPE 0.1</div></header>
<div class="hud"><div class="score"><div><div class="team">CYAN</div><strong id="scoreA">0</strong></div><span style="color:#49677b">:</span><div><div class="team">MAGENTA</div><strong id="scoreB">0</strong></div></div><div id="turn">YOUR TURN</div><button id="reset">RESTART</button></div>
<div class="arena-wrap"><canvas id="game"></canvas><div class="overlay"><div class="toast" id="toast"><b id="toastTitle">GOAL!</b><span id="toastSub">Nice shot</span></div></div></div>
<div class="controls"><div class="hint">Drag back from the glowing striker to aim, then release. Collisions, wall rebounds and rolling friction are simulated in real time.</div><button id="sound">SOUND: ON</button></div>
</div>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
const W=520,H=820,wall=24,goalW=170,goalDepth=26;
let dpr=1,scale=1,ox=0,oy=0,scoreA=0,scoreB=0,turn='A',aim=null,shots=0,particles=[],trails=[],soundOn=true,audio=null,toastTimer=0,settleTimer=0;
const bodies=[];
const make=(x,y,r,mass,color,kind)=>({x,y,vx:0,vy:0,r,mass,color,kind,inv:1/mass,spin:0});
function setup(){
 bodies.length=0;
 bodies.push(make(W/2,H*.76,27,3,'#53f5e8','strikerA'));
 bodies.push(make(W/2,H*.24,27,3,'#ff4f9a','strikerB'));
 bodies.push(make(W/2,H/2,17,1,'#f5fbff','ball'));
 for(let i=0;i<3;i++){bodies.push(make(W/2+(i-1)*47,H*.61,22,2.4,'#1fb9c9','discA'));bodies.push(make(W/2+(i-1)*47,H*.39,22,2.4,'#c73578','discB'));}
 particles=[];trails=[];aim=null;turn='A';settleTimer=0;updateTurn();
}
function resize(){
 const rect=canvas.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);
 canvas.width=Math.max(1,Math.round(rect.width*dpr));canvas.height=Math.max(1,Math.round(rect.height*dpr));
 scale=Math.min(canvas.width/W,canvas.height/H);ox=(canvas.width-W*scale)/2;oy=(canvas.height-H*scale)/2;
}
function pos(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*dpr/scale-ox/scale,y:(e.clientY-r.top)*dpr/scale-oy/scale}}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function updateTurn(){$('turn').textContent=turn==='A'?'YOUR TURN':'OPPONENT TURN';}
function moving(){return bodies.some(b=>Math.hypot(b.vx,b.vy)>.32)}
function playTone(freq=260,dur=.06,type='sine',vol=.035){if(!soundOn)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.value=vol;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.stop(audio.currentTime+dur)}catch{}}
function burst(x,y,color,n=12){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=1+Math.random()*5;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:35+Math.random()*20,color,r:1+Math.random()*3})}}
function showToast(title,sub){$('toastTitle').textContent=title;$('toastSub').textContent=sub;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),1500)}
function strike(b,dx,dy){const len=Math.hypot(dx,dy);if(len<8)return;const power=Math.min(len,150)*.105;b.vx=dx/len*power;b.vy=dy/len*power;b.spin=(dx*b.vy-dy*b.vx)*.002;turn=turn==='A'?'B':'A';shots++;updateTurn();playTone(180,.09,'triangle',.05);burst(b.x,b.y,b.color,7)}
canvas.addEventListener('pointerdown',e=>{
 if(moving()||turn!=='A')return;const p=pos(e),b=bodies[0];
 if(Math.hypot(p.x-b.x,p.y-b.y)<b.r+22){aim={x:p.x,y:p.y};canvas.setPointerCapture(e.pointerId)}
});
canvas.addEventListener('pointermove',e=>{if(aim){let p=pos(e);aim.x=p.x;aim.y=p.y}});
canvas.addEventListener('pointerup',e=>{if(!aim)return;let p=pos(e),b=bodies[0];let dx=b.x-p.x,dy=b.y-p.y;strike(b,dx,dy);aim=null});
canvas.addEventListener('pointercancel',()=>aim=null);
function physics(dt){
 const steps=4,h=dt/steps;
 for(let s=0;s<steps;s++){
  for(const b of bodies){
   b.x+=b.vx*h;b.y+=b.vy*h;
   const drag=Math.pow(.992,h*60);b.vx*=drag;b.vy*=drag;
   b.vx*=Math.pow(.999,h*60);b.vy*=Math.pow(.999,h*60);
   if(Math.hypot(b.vx,b.vy)<.018){b.vx=0;b.vy=0}
   b.spin*=.992;
   const inGoal=b.kind==='ball'&&b.x>W/2-goalW/2+b.r*.25&&b.x<W/2+goalW/2-b.r*.25;
   if(b.x-b.r<wall){b.x=wall+b.r;b.vx=Math.abs(b.vx)*.88;wallFX(b.x,b.y)}
   if(b.x+b.r>W-wall){b.x=W-wall-b.r;b.vx=-Math.abs(b.vx)*.88;wallFX(b.x,b.y)}
   if(b.y-b.r<wall && !inGoal){b.y=wall+b.r;b.vy=Math.abs(b.vy)*.88;wallFX(b.x,b.y)}
   if(b.y+b.r>H-wall && !inGoal){b.y=H-wall-b.r;b.vy=-Math.abs(b.vy)*.88;wallFX(b.x,b.y)}
  }
  for(let i=0;i<bodies.length;i++)for(let j=i+1;j<bodies.length;j++)collide(bodies[i],bodies[j]);
 }
 const ball=bodies[2];
 if(ball.y<-ball.r*.5){scoreA++;goal('A')}
 else if(ball.y>H+ball.r*.5){scoreB++;goal('B')}
}
function wallFX(x,y){if(Math.random()<.09)burst(x,y,'#53f5e8',3)}
function collide(a,b){
 let dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy),min=a.r+b.r;if(!dist||dist>=min)return;
 const nx=dx/dist,ny=dy/dist,overlap=min-dist,total=a.inv+b.inv;
 a.x-=nx*overlap*(a.inv/total)*.82;a.y-=ny*overlap*(a.inv/total)*.82;
 b.x+=nx*overlap*(b.inv/total)*.82;b.y+=ny*overlap*(b.inv/total)*.82;
 const rvx=b.vx-a.vx,rvy=b.vy-a.vy,along=rvx*nx+rvy*ny;
 if(along>0)return;
 const restitution=.91,imp=-(1+restitution)*along/total;
 a.vx-=imp*a.inv*nx;a.vy-=imp*a.inv*ny;b.vx+=imp*b.inv*nx;b.vy+=imp*b.inv*ny;
 const tx=-ny,ty=nx,tangent=(rvx*tx+rvy*ty),friction=clamp(-tangent*.035,-imp*.12,imp*.12);
 a.vx-=friction*a.inv*tx;a.vy-=friction*a.inv*ty;b.vx+=friction*b.inv*tx;b.vy+=friction*b.inv*ty;
 if(imp>1.4){playTone(clamp(100+imp*22,120,520),.035,'sine',.012);if(imp>3)burst((a.x+b.x)/2,(a.y+b.y)/2,'#d8ffff',4)}
}
function goal(who){if(who==='A'){$('scoreA').textContent=scoreA}else{$('scoreB').textContent=scoreB}
 burst(W/2,who==='A'?18:H-18,who==='A'?'#53f5e8':'#ff4f9a',42);playTone(520,.28,'sawtooth',.04);showToast(who==='A'?'GOAL!':'OPPONENT SCORES',who==='A'?'Clean finish':'Keep going');setup();$('scoreA').textContent=scoreA;$('scoreB').textContent=scoreB;}
function ai(){
 if(turn!=='B'||moving()||aim)return;
 const striker=bodies[1],ball=bodies[2],targetX=clamp(ball.x+(W/2-ball.x)*.12,W*.22,W*.78);
 let dx=targetX-striker.x,dy=(ball.y+65)-striker.y;
 const len=Math.hypot(dx,dy)||1;strike(striker,dx/len*100,dy/len*100);
}
function draw(){
 ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);
 ctx.fillStyle='#061523';ctx.fillRect(ox,oy,W*scale,H*scale);ctx.save();ctx.translate(ox,oy);ctx.scale(scale,scale);
 const grad=ctx.createLinearGradient(0,0,W,H);grad.addColorStop(0,'#0d3443');grad.addColorStop(.5,'#0b2638');grad.addColorStop(1,'#101d39');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
 ctx.strokeStyle='#2c7180';ctx.lineWidth=2;ctx.strokeRect(wall,wall,W-2*wall,H-2*wall);
 ctx.strokeStyle='#225363';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(wall,H/2);ctx.lineTo(W-wall,H/2);ctx.stroke();ctx.beginPath();ctx.arc(W/2,H/2,76,0,Math.PI*2);ctx.stroke();
 ctx.strokeStyle='#53f5e8';ctx.shadowColor='#53f5e8';ctx.shadowBlur=16;ctx.lineWidth=4;ctx.strokeRect(W/2-goalW/2,wall-5,goalW,8);ctx.shadowBlur=0;
 ctx.strokeStyle='#ff4f9a';ctx.shadowColor='#ff4f9a';ctx.shadowBlur=16;ctx.strokeRect(W/2-goalW/2,H-wall-3,goalW,8);ctx.shadowBlur=0;
 ctx.fillStyle='#53f5e81c';ctx.fillRect(W/2-goalW/2,wall,goalW,44);ctx.fillStyle='#ff4f9a1c';ctx.fillRect(W/2-goalW/2,H-wall-44,goalW,44);
 for(const t of trails){ctx.globalAlpha=t.life/18*.18;ctx.fillStyle=t.color;ctx.beginPath();ctx.arc(t.x,t.y,t.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
 for(const b of bodies){if(Math.hypot(b.vx,b.vy)>.6&&b.kind==='ball'){trails.push({x:b.x,y:b.y,r:b.r*.8,color:'#d9ffff',life:18})}
  ctx.save();ctx.shadowColor=b.color;ctx.shadowBlur=b.kind==='ball'?22:15;
  let g=ctx.createRadialGradient(b.x-b.r*.35,b.y-b.r*.4,2,b.x,b.y,b.r);g.addColorStop(0,'#ffffff');g.addColorStop(.22,b.color);g.addColorStop(1,'#071421');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
  ctx.strokeStyle=b.kind==='ball'?'#ffffff':'#c7ffff88';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='#ffffff88';ctx.beginPath();ctx.arc(b.x-b.r*.28,b.y-b.r*.3,b.r*.13,0,Math.PI*2);ctx.fill();ctx.restore();
 }
 if(aim){const b=bodies[0],dx=b.x-aim.x,dy=b.y-aim.y,len=Math.hypot(dx,dy),power=Math.min(len,150);
 ctx.strokeStyle='#53f5e8';ctx.lineWidth=4;ctx.setLineDash([9,8]);ctx.globalAlpha=.8;ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x+dx*.85,b.y+dy*.85);ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;
 ctx.fillStyle='#53f5e8';ctx.globalAlpha=.12+power/190;ctx.beginPath();ctx.arc(b.x,b.y,b.r+10,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
 ctx.fillStyle='#b7fff9';ctx.font='bold 13px system-ui';ctx.fillText('POWER '+Math.round(power/150*100)+'%',b.x+35,b.y-34);
 }
 for(const p of particles){ctx.globalAlpha=clamp(p.life/45,0,1);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
 ctx.restore();
 particles=particles.filter(p=>p.life-->0);for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vx*=.96;p.vy*=.96}
 trails=trails.filter(t=>t.life-->0);
}
let last=0,aiWait=0;
function frame(t){let dt=Math.min((t-last)/16.667||1,2);last=t;if(moving())physics(dt);else if(turn==='B'){aiWait+=dt;if(aiWait>30){aiWait=0;ai()}}else aiWait=0;draw();requestAnimationFrame(frame)}
$('reset').addEventListener('click',()=>{scoreA=scoreB=0;$('scoreA').textContent='0';$('scoreB').textContent='0';setup();showToast('MATCH RESET','Ready when you are')});
$('sound').addEventListener('click',()=>{soundOn=!soundOn;$('sound').textContent='SOUND: '+(soundOn?'ON':'OFF')});
new ResizeObserver(resize).observe(canvas);resize();setup();requestAnimationFrame(frame);
})();
</script>
</body></html>
